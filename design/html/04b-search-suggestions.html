<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04b Search & suggestions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&amp;display=swap">

<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
input{font:inherit}
input::placeholder{color:#565881;opacity:1}
input.on-dark::placeholder{color:#A6A7D5;opacity:1}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
</style>
</head>
<body>
<div style="width: 412px; height: 915px; background: #F1EFFF; color: #292B51; font-family: 'Google Sans Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="height: 24px; flex-shrink: 0"></div>

  <div style="flex-shrink: 0; padding: 8px 16px">
    <div role="search" style="height: 56px; border-radius: 28px; background: #E0E0FF; display: flex; align-items: center; gap: 4px; padding: 0 4px">
      <button type="button" aria-label="Close search" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #292B51; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><span class="ms" aria-hidden="true">arrow_back</span></button>
      <label for="search-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search or ask anything</label>
      <input id="search-input" type="text" value="heat pump" style="flex: 1 1 auto; min-width: 0; height: 48px; border: 0; background: transparent; font-size: 16px; line-height: 24px; color: #292B51; padding: 0 4px; outline: none">
      <button type="button" aria-label="Clear text" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #565881; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><span class="ms" aria-hidden="true">close</span></button>
    </div>
  </div>

  <div role="group" aria-label="Suggestions" style="flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 0">

    <div role="group" style="display: flex; flex-direction: column; gap: 2px">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border: 0; border-radius: 20px; background: #FFFFFF; text-align: left; color: #292B51">
        <span aria-hidden="true" style="width: 40px; height: 40px; background: #FC99EF; color: #651162; clip-path: polygon(50.0% 0.0%, 53.2% 1.3%, 56.0% 4.6%, 58.3% 8.5%, 60.3% 11.6%, 62.4% 13.4%, 64.7% 14.4%, 67.1% 15.3%, 69.9% 15.6%, 73.5% 14.8%, 77.9% 13.7%, 82.2% 13.3%, 85.4% 14.6%, 86.7% 17.8%, 86.3% 22.1%, 85.2% 26.5%, 84.4% 30.1%, 84.7% 32.9%, 85.6% 35.3%, 86.6% 37.6%, 88.4% 39.7%, 91.5% 41.7%, 95.4% 44.0%, 98.7% 46.8%, 100.0% 50.0%, 98.7% 53.2%, 95.4% 56.0%, 91.5% 58.3%, 88.4% 60.3%, 86.6% 62.4%, 85.6% 64.7%, 84.7% 67.1%, 84.4% 69.9%, 85.2% 73.5%, 86.3% 77.9%, 86.7% 82.2%, 85.4% 85.4%, 82.2% 86.7%, 77.9% 86.3%, 73.5% 85.2%, 69.9% 84.4%, 67.1% 84.7%, 64.7% 85.6%, 62.4% 86.6%, 60.3% 88.4%, 58.3% 91.5%, 56.0% 95.4%, 53.2% 98.7%, 50.0% 100.0%, 46.8% 98.7%, 44.0% 95.4%, 41.7% 91.5%, 39.7% 88.4%, 37.6% 86.6%, 35.3% 85.6%, 32.9% 84.7%, 30.1% 84.4%, 26.5% 85.2%, 22.1% 86.3%, 17.8% 86.7%, 14.6% 85.4%, 13.3% 82.2%, 13.7% 77.9%, 14.8% 73.5%, 15.6% 69.9%, 15.3% 67.1%, 14.4% 64.7%, 13.4% 62.4%, 11.6% 60.3%, 8.5% 58.3%, 4.6% 56.0%, 1.3% 53.2%, 0.0% 50.0%, 1.3% 46.8%, 4.6% 44.0%, 8.5% 41.7%, 11.6% 39.7%, 13.4% 37.6%, 14.4% 35.3%, 15.3% 32.9%, 15.6% 30.1%, 14.8% 26.5%, 13.7% 22.1%, 13.3% 17.8%, 14.6% 14.6%, 17.8% 13.3%, 22.1% 13.7%, 26.5% 14.8%, 30.1% 15.6%, 32.9% 15.3%, 35.3% 14.4%, 37.6% 13.4%, 39.7% 11.6%, 41.7% 8.5%, 44.0% 4.6%, 46.8% 1.3%); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms fill" style="font-size: 20px">auto_awesome</span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 16px; line-height: 24px; color: #292B51">heat pump</span>
          <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #8E3A88">Ask Skim</span>
        </span>
      </button>
    </div>

    <div role="group" style="display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; border-radius: 20px 20px 4px 4px; background: #FFFFFF; padding-right: 4px">
        <button type="button" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 0 8px 16px; border: 0; background: transparent; text-align: left; color: #292B51">
          <span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #565881; flex-shrink: 0"><span class="ms" aria-hidden="true">search</span></span>
          <span style="font-size: 16px; line-height: 24px; color: #292B51">heat pump vs furnace</span>
        </button>
        <button type="button" aria-label="Edit search: heat pump vs furnace" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #565881; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><span class="ms" aria-hidden="true">north_west</span></button>
      </div>
      <div style="display: flex; align-items: center; border-radius: 4px; background: #FFFFFF; padding-right: 4px">
        <button type="button" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 0 8px 16px; border: 0; background: transparent; text-align: left; color: #292B51">
          <span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #565881; flex-shrink: 0"><span class="ms" aria-hidden="true">search</span></span>
          <span style="font-size: 16px; line-height: 24px; color: #292B51">heat pump cost</span>
        </button>
        <button type="button" aria-label="Edit search: heat pump cost" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #565881; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><span class="ms" aria-hidden="true">north_west</span></button>
      </div>
      <div style="display: flex; align-items: center; border-radius: 4px 4px 20px 20px; background: #FFFFFF; padding-right: 4px">
        <button type="button" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 0 8px 16px; border: 0; background: transparent; text-align: left; color: #292B51">
          <span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #565881; flex-shrink: 0"><span class="ms" aria-hidden="true">search</span></span>
          <span style="font-size: 16px; line-height: 24px; color: #292B51">heat pump rebates 2026</span>
        </button>
        <button type="button" aria-label="Edit search: heat pump rebates 2026" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #565881; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><span class="ms" aria-hidden="true">north_west</span></button>
      </div>
    </div>

    <div role="group" style="display: flex; flex-direction: column; gap: 2px">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border: 0; border-radius: 20px; background: #FFFFFF; text-align: left; color: #292B51">
        <span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #565881; flex-shrink: 0"><span class="ms" aria-hidden="true">history</span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 16px; line-height: 24px; color: #292B51; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Why heat pumps are winning in cold climates</span>
          <span style="font-size: 14px; line-height: 20px; color: #565881">daylightjournal.com</span>
        </span>
      </button>
    </div>

  </div>

</div>
</body>
</html>
