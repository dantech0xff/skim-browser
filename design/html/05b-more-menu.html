<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05b More menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
input{font:inherit}
input::placeholder{color:#565881;opacity:1}
input.on-dark::placeholder{color:#A6A7D5;opacity:1}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
</style>
</head>
<body>
<div style="width: 412px; height: 915px; background: #F8F5FF; color: #292B51; font-family: 'Google Sans Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="height: 24px; flex-shrink: 0"></div>

  <div style="flex-shrink: 0; padding: 8px 16px; background: #F8F5FF">
    <div style="height: 56px; border-radius: 28px; background: #E0E0FF; display: flex; align-items: center; gap: 4px; padding: 0 4px">
      <span style="width: 48px; height: 48px; color: #565881; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true" style="font-size: 20px">lock</span></span>
      <span style="flex: 1 1 auto; min-width: 0; font-size: 16px; line-height: 24px; color: #292B51; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">daylightjournal.com</span>
      <span style="width: 48px; height: 48px; color: #565881; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">chrome_reader_mode</span></span>
    </div>
  </div>

  <div style="flex: 1 1 auto; overflow: hidden; background: #FFFFFF; color: #1F1F1F; font-family: Roboto, system-ui, sans-serif">
    <div style="display: flex; flex-direction: column; gap: 16px; padding: 0 20px 24px">
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E3E3E3; margin: 0 -20px; padding: 0 20px">
        <span style="font-family: Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -0.2px; color: #1F1F1F">Daylight Journal</span>
        <span style="font-size: 12px; line-height: 16px; letter-spacing: 0.8px; text-transform: uppercase; color: #5C5C5C">Energy</span>
      </div>
      <h1 style="margin: 8px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 26px; line-height: 32px; font-weight: 700; color: #1F1F1F; text-wrap: pretty">Why heat pumps are winning in cold climates</h1>
      <div style="font-size: 13px; line-height: 18px; color: #5C5C5C">By Marta Lindqvist</div>
      <div style="height: 176px; border-radius: 4px; background: #DCE2E8"></div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.32)"></div>

  <div role="dialog" aria-label="More options" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: #F1EFFF; color: #292B51; box-shadow: 0px -1px 3px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; padding-bottom: 24px">

    <div aria-hidden="true" style="height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 4px; border-radius: 2px; background: rgba(86,88,129,0.4)"></span></div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px 16px 16px">
      <span aria-hidden="true" style="width: 40px; height: 40px; background: #DADAFF; color: #565881; clip-path: polygon(50.0% 0.0%, 54.9% 0.6%, 59.4% 2.5%, 63.6% 5.3%, 67.1% 8.8%, 70.1% 12.4%, 72.7% 16.0%, 75.2% 19.3%, 77.8% 22.2%, 80.7% 24.8%, 84.0% 27.3%, 87.6% 29.9%, 91.2% 32.9%, 94.7% 36.4%, 97.5% 40.6%, 99.4% 45.1%, 100.0% 50.0%, 99.4% 54.9%, 97.5% 59.4%, 94.7% 63.6%, 91.2% 67.1%, 87.6% 70.1%, 84.0% 72.7%, 80.7% 75.2%, 77.8% 77.8%, 75.2% 80.7%, 72.7% 84.0%, 70.1% 87.6%, 67.1% 91.2%, 63.6% 94.7%, 59.4% 97.5%, 54.9% 99.4%, 50.0% 100.0%, 45.1% 99.4%, 40.6% 97.5%, 36.4% 94.7%, 32.9% 91.2%, 29.9% 87.6%, 27.3% 84.0%, 24.8% 80.7%, 22.2% 77.8%, 19.3% 75.2%, 16.0% 72.7%, 12.4% 70.1%, 8.8% 67.1%, 5.3% 63.6%, 2.5% 59.4%, 0.6% 54.9%, 0.0% 50.0%, 0.6% 45.1%, 2.5% 40.6%, 5.3% 36.4%, 8.8% 32.9%, 12.4% 29.9%, 16.0% 27.3%, 19.3% 24.8%, 22.2% 22.2%, 24.8% 19.3%, 27.3% 16.0%, 29.9% 12.4%, 32.9% 8.8%, 36.4% 5.3%, 40.6% 2.5%, 45.1% 0.6%); display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 24px; font-weight: 600; flex-shrink: 0">D</span>
      <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 16px; line-height: 24px; font-weight: 500; color: #292B51; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Why heat pumps are winning in cold climates</span>
        <span style="font-size: 12px; line-height: 16px; color: #565881">daylightjournal.com</span>
      </span>
      <button type="button" aria-label="Add bookmark" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #565881; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><span class="ms" aria-hidden="true">star</span></button>
      <button type="button" aria-label="Share page" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #565881; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><span class="ms" aria-hidden="true">share</span></button>
    </div>

    <div role="group" aria-label="Page actions" style="display: flex; gap: 12px; margin: 0 16px 16px">
      <button type="button" style="flex: 1 1 0; min-width: 0; height: 56px; border: 0; border-radius: 28px; background: #CCCEFF; color: #343AA2; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; font-size: 16px; line-height: 24px; font-weight: 500; white-space: nowrap"><span class="ms" aria-hidden="true">find_in_page</span>Find in page</button>
      <button type="button" aria-pressed="false" style="flex: 1 1 0; min-width: 0; height: 56px; border: 0; border-radius: 28px; background: #CCCEFF; color: #343AA2; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; font-size: 16px; line-height: 24px; font-weight: 500; white-space: nowrap"><span class="ms" aria-hidden="true">desktop_windows</span>Desktop site</button>
    </div>

    <div role="group" style="display: flex; flex-direction: column; gap: 2px; margin: 0 16px">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 20px 20px 4px 4px; background: #FFFFFF; text-align: left; color: #292B51; font-size: 16px; line-height: 24px"><span class="ms" aria-hidden="true" style="color: #565881; flex-shrink: 0">tab</span>New tab</button>
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 4px 4px 20px 20px; background: #FFFFFF; text-align: left; color: #292B51; font-size: 16px; line-height: 24px"><span class="ms" aria-hidden="true" style="color: #565881; flex-shrink: 0">visibility_off</span>New incognito tab</button>
    </div>

    <div role="group" style="display: flex; flex-direction: column; gap: 2px; margin: 12px 16px 0">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 20px 20px 4px 4px; background: #FFFFFF; text-align: left; color: #292B51; font-size: 16px; line-height: 24px"><span class="ms" aria-hidden="true" style="color: #565881; flex-shrink: 0">bookmarks</span>Bookmarks</button>
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 4px 4px 20px 20px; background: #FFFFFF; text-align: left; color: #292B51; font-size: 16px; line-height: 24px"><span class="ms" aria-hidden="true" style="color: #565881; flex-shrink: 0">history</span>History</button>
    </div>

    <div role="group" style="display: flex; flex-direction: column; gap: 2px; margin: 12px 16px 0">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 20px; background: #FFFFFF; text-align: left; color: #292B51; font-size: 16px; line-height: 24px"><span class="ms" aria-hidden="true" style="color: #565881; flex-shrink: 0">settings</span>Settings</button>
    </div>

  </div>

</div>
</body>
</html>
