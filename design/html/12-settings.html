<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 Settings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
input{font:inherit}
input::placeholder{color:#565881;opacity:1}
input.on-dark::placeholder{color:#A6A7D5;opacity:1}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
</style>
</head>
<body>
<div style="width: 412px; height: 915px; background: #F1EFFF; color: #292B51; font-family: 'Google Sans Flex', Roboto, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="height: 24px; flex-shrink: 0"></div>

  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px">
    <button type="button" aria-label="Back" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #292B51; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" aria-hidden="true">arrow_back</span></button>
  </div>
  <h1 style="margin: 0; padding: 0 16px 12px; font-size: 32px; line-height: 40px; font-weight: 500; color: #292B51; flex-shrink: 0">Settings</h1>

  <div style="flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 24px">

    <h2 style="margin: 0; padding: 12px 32px 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #004FD9">General</h2>
    <div role="group" style="display: flex; flex-direction: column; gap: 2px; margin: 0 16px">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border: 0; border-radius: 20px 20px 4px 4px; background: #FFFFFF; text-align: left; color: #292B51">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #CCCEFF; color: #343AA2; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">search</span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 24px; color: #292B51">Search engine</span><span style="font-size: 14px; line-height: 20px; color: #565881">Google</span></span>
      </button>
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border: 0; border-radius: 4px; background: #FFFFFF; text-align: left; color: #292B51">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #7D9CFF; color: #001D5C; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">public</span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 24px; color: #292B51">Default browser</span><span style="font-size: 14px; line-height: 20px; color: #565881">Skim is your default</span></span>
      </button>
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border: 0; border-radius: 4px 4px 20px 20px; background: #FFFFFF; text-align: left; color: #292B51">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #CCCEFF; color: #343AA2; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">palette</span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 24px; color: #292B51">Theme</span><span style="font-size: 14px; line-height: 20px; color: #565881">System default</span></span>
      </button>
    </div>

    <h2 style="margin: 0; padding: 20px 32px 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #004FD9">Skim AI</h2>
    <div role="group" style="display: flex; flex-direction: column; gap: 2px; margin: 0 16px">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border: 0; border-radius: 20px; background: #FFFFFF; text-align: left; color: #292B51">
        <span aria-hidden="true" style="width: 40px; height: 40px; background: #FC99EF; color: #651162; clip-path: polygon(50.0% 0.0%, 53.2% 1.3%, 56.0% 4.6%, 58.3% 8.5%, 60.3% 11.6%, 62.4% 13.4%, 64.7% 14.4%, 67.1% 15.3%, 69.9% 15.6%, 73.5% 14.8%, 77.9% 13.7%, 82.2% 13.3%, 85.4% 14.6%, 86.7% 17.8%, 86.3% 22.1%, 85.2% 26.5%, 84.4% 30.1%, 84.7% 32.9%, 85.6% 35.3%, 86.6% 37.6%, 88.4% 39.7%, 91.5% 41.7%, 95.4% 44.0%, 98.7% 46.8%, 100.0% 50.0%, 98.7% 53.2%, 95.4% 56.0%, 91.5% 58.3%, 88.4% 60.3%, 86.6% 62.4%, 85.6% 64.7%, 84.7% 67.1%, 84.4% 69.9%, 85.2% 73.5%, 86.3% 77.9%, 86.7% 82.2%, 85.4% 85.4%, 82.2% 86.7%, 77.9% 86.3%, 73.5% 85.2%, 69.9% 84.4%, 67.1% 84.7%, 64.7% 85.6%, 62.4% 86.6%, 60.3% 88.4%, 58.3% 91.5%, 56.0% 95.4%, 53.2% 98.7%, 50.0% 100.0%, 46.8% 98.7%, 44.0% 95.4%, 41.7% 91.5%, 39.7% 88.4%, 37.6% 86.6%, 35.3% 85.6%, 32.9% 84.7%, 30.1% 84.4%, 26.5% 85.2%, 22.1% 86.3%, 17.8% 86.7%, 14.6% 85.4%, 13.3% 82.2%, 13.7% 77.9%, 14.8% 73.5%, 15.6% 69.9%, 15.3% 67.1%, 14.4% 64.7%, 13.4% 62.4%, 11.6% 60.3%, 8.5% 58.3%, 4.6% 56.0%, 1.3% 53.2%, 0.0% 50.0%, 1.3% 46.8%, 4.6% 44.0%, 8.5% 41.7%, 11.6% 39.7%, 13.4% 37.6%, 14.4% 35.3%, 15.3% 32.9%, 15.6% 30.1%, 14.8% 26.5%, 13.7% 22.1%, 13.3% 17.8%, 14.6% 14.6%, 17.8% 13.3%, 22.1% 13.7%, 26.5% 14.8%, 30.1% 15.6%, 32.9% 15.3%, 35.3% 14.4%, 37.6% 13.4%, 39.7% 11.6%, 41.7% 8.5%, 44.0% 4.6%, 46.8% 1.3%); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms fill" style="font-size: 20px">auto_awesome</span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 24px; color: #292B51">AI &amp; privacy</span><span style="font-size: 14px; line-height: 20px; color: #565881">Asks before reading new sites</span></span>
      </button>
    </div>

    <h2 style="margin: 0; padding: 20px 32px 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #004FD9">Privacy</h2>
    <div role="group" style="display: flex; flex-direction: column; gap: 2px; margin: 0 16px">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border: 0; border-radius: 20px; background: #FFFFFF; text-align: left; color: #292B51">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #F74B6D; color: #510017; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">delete</span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 24px; color: #292B51">Clear browsing data</span><span style="font-size: 14px; line-height: 20px; color: #565881">History, cookies and cached files</span></span>
      </button>
    </div>

    <h2 style="margin: 0; padding: 20px 32px 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #004FD9">About</h2>
    <div role="group" style="display: flex; flex-direction: column; gap: 2px; margin: 0 16px">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 20px 20px 4px 4px; background: #FFFFFF; text-align: left; color: #292B51">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #E7E6FF; color: #565881; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">shield</span></span>
        <span style="flex: 1 1 auto; font-size: 16px; line-height: 24px; color: #292B51">Privacy policy</span>
      </button>
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 4px; background: #FFFFFF; text-align: left; color: #292B51">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #E7E6FF; color: #565881; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">description</span></span>
        <span style="flex: 1 1 auto; font-size: 16px; line-height: 24px; color: #292B51">Terms of service</span>
      </button>
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border: 0; border-radius: 4px; background: #FFFFFF; text-align: left; color: #292B51">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #E7E6FF; color: #565881; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">code</span></span>
        <span style="flex: 1 1 auto; font-size: 16px; line-height: 24px; color: #292B51">Open-source licenses</span>
      </button>
      <div style="width: 100%; display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border-radius: 4px 4px 20px 20px; background: #FFFFFF; color: #292B51">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #E7E6FF; color: #565881; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms" aria-hidden="true">info</span></span>
        <span style="flex: 1 1 auto; font-size: 16px; line-height: 24px; color: #292B51">Version</span>
        <span style="font-size: 14px; line-height: 20px; color: #565881">1.0.0 (100)</span>
      </div>
    </div>

  </div>

</div>
</body>
</html>
