sdk=36
# Espresso.onIdle deadlocks the paused main looper when Compose's link is registered.
# See ShadowSkimEspresso. The package has to be instrumented or the shadow never runs.
instrumentedPackages=androidx.test.espresso
shadows=com.dantech.skimbrowser.testing.ShadowSkimEspresso

# JVM tests run on a plain Application: SkimApplication.onCreate starts reading the saved tabs in
# the background (database, settings, network callback), which would reach into every test. A test
# of the app's own start-up sets @Config(application = SkimApplication::class) itself.
application=android.app.Application
