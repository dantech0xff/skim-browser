<!doctype html>
<!-- One link over the whole page to ?href=: a tap anywhere follows it. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link</title>
<style>html,body{margin:0;height:100%} a{display:block;width:100%;height:100%;font-size:32px}</style></head>
<body><a id="link">Follow the link</a>
<script>
document.getElementById('link').href = new URLSearchParams(location.search).get('href');
</script></body></html>
