<!doctype html>
<!-- The popup: one button over the whole page closes the window. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popup</title>
<style>html,body{margin:0;height:100%} button{position:fixed;left:0;top:0;width:100%;height:100%;font-size:32px}</style></head>
<body><button id="close" type="button">Close this window</button>
<script>
window.skimHasOpener = window.opener !== null;
document.getElementById('close').addEventListener('click', function () { window.close(); });
</script></body></html>
