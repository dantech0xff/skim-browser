name: Feature request
description: A change that still fits the product rules.
title: "[Feature] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This version is Android only and uses one WebView per tab. Page-ad blocking is deferred. The AI request contract stays as it is. Read docs/product-vision.md before you write the request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change
      description: What the app should do after the change.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: What this request is not asking for.
    validations:
      required: false
