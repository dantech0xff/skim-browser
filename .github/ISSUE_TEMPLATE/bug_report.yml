name: Bug report
description: A behavior that does not match the product rules.
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what the app did, and what you expected.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: Variant, version, and Android version. Example. debug, 1.0, Android 16.
      placeholder: releaseSmoke or debug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Number the steps. Include the page URL when the bug is on a page.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logcat lines that name the failure. Leave out account data and API keys.
    validations:
      required: false
