name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit tests, lint, coverage, releaseSmoke
    # ubuntu-latest is 26.04. Robolectric native graphics deadlocks there inside
    # Compose performClick. Pin the previous LTS image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties with no proxy URL
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$sdk"
          printf 'sdk.dir=%s\nskim.aiProxyUrl=\n' "$sdk" > local.properties
          if grep -E 'sk-ant-|aiProxyUrl=.+' local.properties; then
            echo "local.properties must not contain a key or a proxy URL" >&2
            exit 1
          fi

      - name: Run unit tests
        # A healthy run finishes in about 7 minutes. A paused-looper hang used to sit here
        # until 40 minutes. HungTestWatch dumps threads and kills the worker after 20 seconds.
        timeout-minutes: 15
        run: |
          cat > /tmp/test-log.init.gradle << 'EOF'
          gradle.projectsLoaded {
              rootProject.subprojects {
                  afterEvaluate {
                      tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                          testLogging {
                              events "started", "failed"
                              exceptionFormat "short"
                          }
                      }
                  }
              }
          }
          EOF
          ./gradlew :app:testPlayDebugUnitTest --no-configuration-cache --stacktrace --init-script /tmp/test-log.init.gradle

      - name: Run lint
        run: ./gradlew :app:lintPlayDebug :app:lintFullDebug --no-configuration-cache --stacktrace

      - name: Write the Kover XML report
        run: ./gradlew :app:koverXmlReportPlayDebug --no-configuration-cache --stacktrace

      - name: Check the 80 percent line floor
        run: |
          python3 tools/check_line_coverage.py --self-test
          python3 tools/check_line_coverage.py app/build/reports/kover/reportPlayDebug.xml

      - name: Assemble both releaseSmoke flavors
        run: ./gradlew :app:assemblePlayReleaseSmoke :app:assembleFullReleaseSmoke --no-configuration-cache --stacktrace

      - name: Check the play APK has no YouTube extractor
        run: |
          python3 tools/check_play_has_no_youtube.py --self-test
          python3 tools/check_play_has_no_youtube.py \
            --apk app/build/outputs/apk/play/releaseSmoke \
            --mapping app/build/outputs/mapping/playReleaseSmoke/mapping.txt

      - name: Upload reports after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
