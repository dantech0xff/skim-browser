name: Proxy

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: proxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Worker tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
