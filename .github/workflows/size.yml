name: Size budget

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: size-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    name: releaseSmoke APK size
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties with no proxy URL
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$sdk"
          printf 'sdk.dir=%s\nskim.aiProxyUrl=\n' "$sdk" > local.properties
          if grep -E 'sk-ant-|aiProxyUrl=.+' local.properties; then
            echo "local.properties must not contain a key or a proxy URL" >&2
            exit 1
          fi

      - name: Check the UI font subset
        run: |
          python3 -m pip install --user 'fonttools>=4.54' 'uharfbuzz>=0.37'
          python3 tools/subset_google_sans_flex.py --check

      - name: Assemble releaseSmoke
        run: ./gradlew :app:assembleReleaseSmoke --no-configuration-cache --stacktrace

      - name: Check the APK budget
        run: |
          python3 tools/check_apk_budget.py --self-test
          python3 tools/check_apk_budget.py
