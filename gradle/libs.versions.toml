# Versions read from <repo>/<group path>/<artifact>/maven-metadata.xml:
#   GM = https://dl.google.com/android/maven2   MC = https://repo1.maven.org/maven2
#   GPP = https://plugins.gradle.org/m2
[versions]
agp = "9.4.1"                  # GM com/android/tools/build/gradle
kotlin = "2.4.21"              # MC org/jetbrains/kotlin/kotlin-gradle-plugin (lifts AGP's bundled KGP 2.2.10)
ksp = "2.3.12"                 # MC com/google/devtools/ksp/symbol-processing-gradle-plugin
composeBom = "2026.09.00"      # GM androidx/compose/compose-bom (Compose 1.12.1, material3 1.4.0)
material3 = "1.5.0-beta01"     # GM androidx/compose/material3/material3; overrides the BOM for the Expressive APIs
coreKtx = "1.19.1"             # GM androidx/core/core-ktx
activityCompose = "1.13.0"     # GM androidx/activity/activity-compose
lifecycle = "2.11.0"           # GM androidx/lifecycle/lifecycle-viewmodel-compose (+ -navigation3, -savedstate)
navigation3 = "1.2.0"          # GM androidx/navigation3/navigation3-runtime
webkit = "1.17.1"              # GM androidx/webkit/webkit
room = "2.8.5"                 # GM androidx/room/room-runtime
datastore = "1.2.1"            # GM androidx/datastore/datastore-preferences
coroutines = "1.11.0"          # MC org/jetbrains/kotlinx/kotlinx-coroutines-core
serializationJson = "1.12.0"   # MC org/jetbrains/kotlinx/kotlinx-serialization-json
collectionsImmutable = "0.5.2" # MC org/jetbrains/kotlinx/kotlinx-collections-immutable
aboutLibraries = "15.3.0"      # GPP com/mikepenz/aboutlibraries/plugin + MC com/mikepenz/aboutlibraries-compose-m3
anthropic = "2.73.0"           # MC com/anthropic/anthropic-java
jsoup = "1.23.2"               # MC org/jsoup/jsoup
okhttp = "4.12.0"              # MC com/squareup/okhttp3/okhttp; same version anthropic-java pulls in
junit = "4.13.2"               # MC junit/junit
junitVersion = "1.3.0"         # GM androidx/test/ext/junit
androidxTestRunner = "1.7.0"   # GM androidx/test/runner
espressoCore = "3.7.0"         # GM androidx/test/espresso/espresso-core
robolectric = "4.17"           # MC org/robolectric/robolectric
roborazzi = "1.76.0"           # MC io/github/takahirom/roborazzi/roborazzi
turbine = "1.2.1"              # MC app/cash/turbine/turbine
kover = "0.9.11"               # GPP org/jetbrains/kotlinx/kover-gradle-plugin
benchmark = "1.4.1"            # GM androidx/benchmark/benchmark-macro-junit4
profileinstaller = "1.4.1"     # GM androidx/profileinstaller/profileinstaller
uiautomator = "2.3.0"          # GM androidx/test/uiautomator/uiautomator
hilt = "2.60.1"                # MC com/google/dagger/hilt-android
hiltLifecycleViewmodelCompose = "1.4.0" # GM androidx/hilt/hilt-lifecycle-viewmodel-compose
kotlinMetadata = "2.4.21"      # MC org/jetbrains/kotlin/kotlin-metadata-jvm

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activityCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
